bc_steps: 50000
batch_size: 256
lr: 0.0001

log_interval: 500        # how often we print training progress
eval_interval: 100       # how often we get eval metrics + log likelihood for TensorBoard 
rollout_interval: 500    # how often we rollout & get avg reward for TensorBoard
n_eval_rollouts: 25      # rollouts per rollout_interval