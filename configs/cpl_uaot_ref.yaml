# CPL with unpaired AOT, WITH reference policy (log-ratio segment scores)
ref_bc_steps: 20000      # phase 0: BC steps for the shared π_ref (REF_POLICY); used here for log-ratio scoring
bc_warmup_steps: 10000   # phase 1: BC warmup of π_θ before contrastive training
cpl_uaot_steps: 20000    # phase 2: uAOT contrastive steps
batch_size: 256          # BC warmup batch (obs, action) pairs
uaot_batch_size: 64      # contrastive batch (preference pairs per step → pooled segment scores)
lr: 0.0001
alpha: 0.1               # entropy temperature
gamma: 1.0               # discount in the segment score
log_interval: 500
eval_interval: 500
