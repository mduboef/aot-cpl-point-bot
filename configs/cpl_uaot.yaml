# CPL with unpaired AOT, NO reference policy (raw segment scores)
ref_bc_steps: 50000      # π_ref (shared REF_POLICY) still trained/cached by train.py; unused by this variant
bc_warmup_steps: 20000   # phase 1: BC warmup of π_θ before contrastive training
cpl_uaot_steps: 30000    # phase 2: uAOT contrastive steps
batch_size: 256          # BC warmup batch (obs, action) pairs
uaot_batch_size: 64      # contrastive batch (preference pairs per step → pooled segment scores)
lr: 0.0001
alpha: 0.1               # entropy temperature
gamma: 1.0               # discount in the segment score
log_interval: 500
eval_interval: 500
