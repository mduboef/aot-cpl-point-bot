# conservative (biased) CPL, λ = 0.5 (no reference policy)
ref_bc_steps: 50000
bc_warmup_steps: 20000   # phase 2: BC warmup of π_θ before contrastive training
cpl_steps: 30000         # phase 3: CPL contrastive steps
batch_size: 256          # BC warmup batch (obs, action) pairs
cpl_batch_size: 64       # contrastive batch (preference pairs per step)
lr: 0.0001
alpha: 0.1               # entropy temperature
gamma: 1.0               # discount in the segment score
contrastive_bias: 0.5    # λ = 0.5 conservative CPL (anchors absolute action density)
log_interval: 500
eval_interval: 500
